name: Pull Request Pipeline

on:
  pull_request:
    branches: [ main, develop ]

jobs:

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Restore dependencies
        run: dotnet restore src

      - name: Build
        run: dotnet build src --no-restore --configuration Release

      - name: Test
        run: |
          dotnet test src/Cloudmart.slnx --no-build \
            --configuration Release \
            --logger "trx;LogFileName=results.trx" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          directory: ./coverage

      - name: .NET Test Reporter
        uses: bibipkins/dotnet-test-reporter@v1.6.4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-title: 'Unit Test Results'
          results-path: ./coverage/*.trx
          coverage-path: ./coverage/**/**/pombo/coverage.cobertura.xml
          coverage-threshold: 80

#  lint-commits:
