stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 48h     # dev: 2 dias. Em prod, aumente para 720h (30 dias)

metrics_generator:
  registry:
    external_labels:
      source: tempo
      cluster: cloudmart-dev
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  processor:
    local_blocks:
      max_live_traces: 10000
      max_block_duration: 5m
      max_block_bytes: 314572800
      flush_check_period: 10s
      trace_idle_period: 10s
      complete_block_timeout: 15s
storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

overrides:
  defaults:
    metrics_generator:
      processors:
        - service-graphs    # gera métricas de grafo de serviços
        - span-metrics      # gera métricas RED por span
        - local-blocks      # ← necessário para queries TraceQL com rate()
      generate_native_histograms: both
